name: Zostavenie EviTA

on:
  push:
    branches: [ main, 'vyvoj/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zostavenie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zostavenie:
    runs-on: windows-latest
    steps:
      - name: Stiahnuť zdrojový kód
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nainštalovať .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Určiť verziu
        id: verzia
        shell: pwsh
        run: |
          $v = "0.6.${{ github.run_number }}"
          "cislo=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Verzia: $v"

      - name: Zostaviť program
        shell: pwsh
        run: >
          dotnet publish src/Evita.App/Evita.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.verzia.outputs.cislo }}
          -o publish

      - name: Samotest programu
        shell: pwsh
        run: |
          $env:EVITA_DATA_DIR = Join-Path $env:RUNNER_TEMP "evita-samotest"
          $p = Start-Process -FilePath "publish\EviTA.exe" -ArgumentList "--samotest" -PassThru
          $null = $p.Handle
          $log = Join-Path $env:EVITA_DATA_DIR "samotest.log"
          if (-not $p.WaitForExit(300000)) {
            $p.Kill()
            Write-Host "::error::Samotest neskončil do 5 minút"
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          if (Test-Path $log) {
            Get-Content $log
            Get-Content $log | Where-Object { $_ -cmatch 'CHYBA' } | Select-Object -First 5 | ForEach-Object {
              $riadok = $_ -replace "`r", '' -replace '%', '%25'
              Write-Host "::error::$riadok"
            }
          } else {
            Write-Host "::error::Samotest nevytvoril záznam (kód $($p.ExitCode))"
          }
          if ($p.ExitCode -ne 0) { exit 1 }
          Write-Host "::notice::Samotest OK"

      - name: Uložiť výstupy samotestu (len vývojové vetvy)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zdroj = Join-Path $env:RUNNER_TEMP "evita-samotest"
          $ciel = Join-Path $env:RUNNER_TEMP "vystupy"
          New-Item -ItemType Directory -Force $ciel | Out-Null
          foreach ($p in @("Export", "Vzory")) {
            if (Test-Path (Join-Path $zdroj $p)) { Copy-Item (Join-Path $zdroj "$p\*") $ciel -Force }
          }
          Copy-Item (Join-Path $zdroj "samotest.log") $ciel -ErrorAction SilentlyContinue
          Set-Location $ciel
          git init -q -b vystupy
          git config user.name "EviTA zostavenie"
          git config user.email "zostavenie@users.noreply.github.com"
          git add -A
          git commit -q -m "Výstupy samotestu ${{ github.sha }}"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" vystupy

      - name: Zostaviť inštalátor
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.verzia.outputs.cislo }}" "/DSourceDir=$PWD\publish" installer\evita.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zverejniť novú verziu
        # vývojové vetvy sa len zostavia a otestujú, verzia sa zverejní iba z vetvy main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verzia = "${{ steps.verzia.outputs.cislo }}"
          $instalator = "installer/Output/EviTA_Setup_$verzia.exe"

          # staré priebežné vydanie z prvých verzií už nepotrebujeme
          gh release delete najnovsia --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0

          # novinky = zmeny od predchádzajúcej verzie
          $predosla = git describe --tags --abbrev=0 --match "v*" 2>$null
          $global:LASTEXITCODE = 0
          if ($predosla) {
            $zmeny = git log --no-merges --pretty=format:"- %s" "$predosla..HEAD"
          } else {
            $zmeny = git log --no-merges --pretty=format:"- %s" -n 15
          }
          $poznamky = @(
            "## Novinky vo verzii $verzia",
            "",
            ($zmeny -join "`n"),
            "",
            "Stiahnite súbor **EviTA_Setup_$verzia.exe** a spustite ho. Nainštalovaná EviTA (od verzie 0.2.7) ponúkne aktualizáciu sama pri spustení."
          ) -join "`n"
          Set-Content -Path notes.md -Value $poznamky -Encoding utf8

          gh release create "v$verzia" $instalator `
            --title "EviTA $verzia" `
            --notes-file notes.md `
            --latest `
            --target ${{ github.sha }}
