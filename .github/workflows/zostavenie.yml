name: Zostavenie EviTA

on:
  push:
    branches: [ main, 'vyvoj/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zostavenie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zostavenie:
    runs-on: windows-latest
    steps:
      - name: Stiahnuť zdrojový kód
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nainštalovať .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Určiť verziu
        id: verzia
        shell: pwsh
        run: |
          $v = "0.7.${{ github.run_number }}"
          "cislo=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Verzia: $v"

      - name: Kontrola prekladov
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python nastroje/preklady.py kontrola
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Niektoré texty nemajú preklad (nastroje/preklady.py kontrola)" }
          exit 0

      - name: Čítačka kódov zxing-cpp zo zdrojového kódu (overená verzia)
        # natívna knižnica sa nepreberá hotová, ale skompiluje sa tu z pevne určeného commitu a skontroluje sa,
        # že nevolá sieť, registre ani iné programy (smie používať len jadro Windows a knižnice C/C++)
        shell: pwsh
        run: |
          $verzia = "v3.1.1"
          $overenyCommit = "287c85df6f961c8efbfb5ffd736cd9457b8b890e"
          $zdroj = Join-Path $env:RUNNER_TEMP "zxing-cpp"
          git clone --quiet --depth 1 --branch $verzia https://github.com/zxing-cpp/zxing-cpp $zdroj
          $commit = (git -C $zdroj rev-parse HEAD).Trim()
          if ($commit -ne $overenyCommit) {
            Write-Host "::error::zxing-cpp $verzia má commit $commit, overený je $overenyCommit"
            exit 1
          }

          # čítanie aj tvorba kódov (pôvodný kódovač zxing-cpp, bez knižnice zint); nič ďalšie sa nesťahuje
          # (ZXING_DEPENDENCIES=LOCAL, prázdny priečinok namiesto knižnice stb pre testovací program, ktorý sa nezostavuje)
          $zostava = Join-Path $env:RUNNER_TEMP "zxing-cpp-build"
          $prazdny = Join-Path $env:RUNNER_TEMP "zxing-cpp-bez-stb"
          New-Item -ItemType Directory -Force $prazdny | Out-Null
          cmake -S $zdroj -B $zostava -A x64 -DBUILD_SHARED_LIBS=ON -DZXING_READERS=ON -DZXING_WRITERS=OLD `
            -DZXING_C_API=ON -DZXING_EXAMPLES=OFF -DZXING_BLACKBOX_TESTS=OFF -DZXING_UNIT_TESTS=OFF -DZXING_LINK_CPP_STATICALLY=ON `
            -DZXING_DEPENDENCIES=LOCAL "-DSTB_IMAGE_INCLUDE_DIR=$prazdny"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $zostava --config Release --target ZXing --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Get-ChildItem $zostava -Recurse -Filter ZXing.dll | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $dll) { Write-Host "::error::ZXing.dll sa nezostavila"; exit 1 }

          # kontrola, z ktorých knižníc Windows natívna čítačka volá funkcie
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $importy = & $dumpbin.FullName /nologo /imports $dll.FullName
          $kniznice = $importy | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1].ToLowerInvariant() } } | Sort-Object -Unique
          Write-Host "::notice::ZXing.dll používa len tieto knižnice Windows: $($kniznice -join ', ')"
          $povolene = '^(kernel32\.dll|vcruntime140(_1)?\.dll|msvcp140\.dll|api-ms-win-crt-[a-z0-9-]+\.dll)$'
          $zakazane = $kniznice | Where-Object { $_ -notmatch $povolene }
          if ($zakazane) {
            Write-Host "::error::Čítačka kódov používa nepovolené knižnice: $($zakazane -join ', ')"
            exit 1
          }

          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
          Write-Host "::notice::ZXing.dll zo zxing-cpp $verzia ($commit), SHA-256 $hash"
          New-Item -ItemType Directory -Force src/Evita.App/Native | Out-Null
          Copy-Item $dll.FullName src/Evita.App/Native/ZXing.dll

      - name: Vyrovnávacia pamäť – prepis hlasu (whisper.cpp)
        id: cache-hlas
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/evita-hlas-dll
          key: evita-hlas-d1be6fde11ac6e0407606b4e42fe72d34add8037-${{ hashFiles('nastroje/hlas/**') }}

      - name: Prepis hlasu whisper.cpp zo zdrojového kódu (overená verzia)
        # prepis diktovania bez internetu: whisper.cpp sa nepreberá hotový, ale skompiluje sa z pevne určeného commitu
        # spolu s tenkou vrstvou nastroje/hlas/evita_hlas.c; kontroluje sa, z ktorých knižníc Windows volá funkcie
        shell: pwsh
        run: |
          $verzia = "v1.9.5"
          $overenyCommit = "d1be6fde11ac6e0407606b4e42fe72d34add8037"
          $ciel = Join-Path $env:RUNNER_TEMP "evita-hlas-dll"
          if (-not (Test-Path (Join-Path $ciel "EvitaHlas.dll"))) {
            $zdroj = Join-Path $env:RUNNER_TEMP "whisper.cpp"
            git clone --quiet --depth 1 --branch $verzia https://github.com/ggml-org/whisper.cpp $zdroj
            $commit = (git -C $zdroj rev-parse HEAD).Trim()
            if ($commit -ne $overenyCommit) {
              Write-Host "::error::whisper.cpp $verzia má commit $commit, overený je $overenyCommit"
              exit 1
            }
            $zostava = Join-Path $env:RUNNER_TEMP "evita-hlas-build"
            cmake -S nastroje/hlas -B $zostava -A x64 "-DWHISPER_ZDROJ=$zdroj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $zostava --config Release --target EvitaHlas --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dll = Get-ChildItem $zostava -Recurse -Filter EvitaHlas.dll | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
            if (-not $dll) { Write-Host "::error::EvitaHlas.dll sa nezostavila"; exit 1 }
            New-Item -ItemType Directory -Force $ciel | Out-Null
            Copy-Item $dll.FullName (Join-Path $ciel "EvitaHlas.dll")
            Copy-Item (Join-Path $zdroj "LICENSE") (Join-Path $ciel "LICENSE-whisper.cpp.txt")
          }
          $dll = Get-Item (Join-Path $ciel "EvitaHlas.dll")
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $importy = & $dumpbin.FullName /nologo /imports $dll.FullName
          $kniznice = $importy | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1].ToLowerInvariant() } } | Sort-Object -Unique
          Write-Host "::notice::EvitaHlas.dll používa len tieto knižnice Windows: $($kniznice -join ', ')"
          $povolene = '^(kernel32\.dll|vcruntime140(_1)?\.dll|msvcp140\.dll|api-ms-win-crt-[a-z0-9-]+\.dll)$'
          $zakazane = $kniznice | Where-Object { $_ -notmatch $povolene }
          if ($zakazane) {
            Write-Host "::error::Prepis hlasu používa nepovolené knižnice: $($zakazane -join ', ')"
            exit 1
          }
          $exporty = (& $dumpbin.FullName /nologo /exports $dll.FullName) -join "`n"
          foreach ($f in @("evita_hlas_otvor", "evita_hlas_prepis", "evita_hlas_zavri")) {
            if ($exporty -notmatch $f) { Write-Host "::error::EvitaHlas.dll nemá funkciu $f"; exit 1 }
          }
          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
          Write-Host "::notice::EvitaHlas.dll z whisper.cpp $verzia ($overenyCommit), SHA-256 $hash"
          New-Item -ItemType Directory -Force src/Evita.App/Native | Out-Null
          Copy-Item $dll.FullName src/Evita.App/Native/EvitaHlas.dll
          Copy-Item (Join-Path $ciel "LICENSE-whisper.cpp.txt") src/Evita.App/Native/LICENSE-whisper.cpp.txt

      - name: Vyrovnávacia pamäť – model na prepis pre samotest
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/evita-model
          key: evita-model-ggml-small-1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b

      - name: Model a slovenská skúšobná nahrávka pre samotest diktovania
        # len pre samotest: model ggml-small (overený SHA-256) a slovenská veta z hlasového syntetizátora Piper
        continue-on-error: true
        shell: pwsh
        run: |
          $priecinok = Join-Path $env:RUNNER_TEMP "evita-model"
          New-Item -ItemType Directory -Force $priecinok | Out-Null
          $model = Join-Path $priecinok "ggml-small.bin"
          $sha = "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
          if (-not (Test-Path $model) -or (Get-FileHash $model -Algorithm SHA256).Hash -ne $sha) {
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin" -OutFile $model
          }
          if ((Get-FileHash $model -Algorithm SHA256).Hash -ne $sha) { Write-Host "::error::Model ggml-small.bin má iný SHA-256"; exit 1 }

          $hlas = Join-Path $env:RUNNER_TEMP "evita-hlas-test"
          New-Item -ItemType Directory -Force $hlas | Out-Null
          python -m pip install --quiet piper-tts
          $zaklad = "https://huggingface.co/rhasspy/piper-voices/resolve/main/sk/sk_SK/lili/medium/sk_SK-lili-medium.onnx"
          Invoke-WebRequest $zaklad -OutFile (Join-Path $hlas "sk.onnx")
          Invoke-WebRequest "$zaklad.json" -OutFile (Join-Path $hlas "sk.onnx.json")
          $skript = Join-Path $hlas "syntetizuj.py"
          @"
          import sys, wave
          from piper import PiperVoice
          hlas = PiperVoice.load(sys.argv[1])
          with wave.open(sys.argv[2], "wb") as w:
              if hasattr(hlas, "synthesize_wav"):
                  hlas.synthesize_wav(sys.argv[3], w)
              else:
                  hlas.synthesize(sys.argv[3], w)
          "@ | Set-Content $skript -Encoding utf8
          $wav = Join-Path $hlas "poznamka.wav"
          python $skript (Join-Path $hlas "sk.onnx") $wav "Notebook v učebni číslo dva má poškodenú klávesnicu. Tlačiareň v kabinete treba vymeniť."
          if (-not (Test-Path $wav)) { Write-Host "::warning::Slovenská nahrávka sa nevytvorila"; exit 0 }
          "EVITA_SAMOTEST_HLAS=$wav" >> $env:GITHUB_ENV
          "EVITA_SAMOTEST_HLAS_MODEL=$model" >> $env:GITHUB_ENV
          Copy-Item $wav (Join-Path $env:RUNNER_TEMP "poznamka_skusobna.wav")

      - name: Zostaviť program
        shell: pwsh
        run: >
          dotnet publish src/Evita.App/Evita.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.verzia.outputs.cislo }}
          -o publish

      - name: Samotest programu
        shell: pwsh
        run: |
          $env:EVITA_DATA_DIR = Join-Path $env:RUNNER_TEMP "evita-samotest"
          $env:EVITA_SAMOTEST_FOTKY = Join-Path $PWD "testy\fotky"
          $p = Start-Process -FilePath "publish\EviTA.exe" -ArgumentList "--samotest" -PassThru
          $null = $p.Handle
          $log = Join-Path $env:EVITA_DATA_DIR "samotest.log"
          if (-not $p.WaitForExit(480000)) {
            $p.Kill()
            Write-Host "::error::Samotest neskončil do 8 minút"
            if (Test-Path $log) { Get-Content $log }
            $priebeh = Join-Path $env:EVITA_DATA_DIR "samotest_priebeh.log"
            if (Test-Path $priebeh) {
              Get-Content $priebeh -Tail 3 | ForEach-Object { Write-Host "::error::posledný krok: $($_ -replace '%', '%25')" }
            }
            exit 1
          }
          if (Test-Path $log) {
            Get-Content $log
            Get-Content $log | Where-Object { $_ -cmatch 'CHYBA' } | Select-Object -First 5 | ForEach-Object {
              $riadok = $_ -replace "`r", '' -replace '%', '%25'
              Write-Host "::error::$riadok"
            }
          } else {
            Write-Host "::error::Samotest nevytvoril záznam (kód $($p.ExitCode))"
          }
          if ($p.ExitCode -ne 0) { exit 1 }
          Write-Host "::notice::Samotest OK"

      - name: Overenie PDF/A (veraPDF)
        # nezávislá kontrola archívnych PDF zo samotestu validátorom veraPDF (PDF Association)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $export = Join-Path $env:RUNNER_TEMP "evita-samotest\Export"
          $subory = @(Get-ChildItem $export -Filter "samotest_pdf_pdfa*.pdf" -ErrorAction SilentlyContinue)
          if ($subory.Count -eq 0) { Write-Host "::warning::Žiadne PDF/A na overenie"; exit 0 }
          Start-Transcript -Path (Join-Path $export "verapdf_priebeh.txt") | Out-Null
          $ErrorActionPreference = "Continue"
          if ($env:JAVA_HOME_17_X64) { $env:JAVA_HOME = $env:JAVA_HOME_17_X64; $env:Path = "$env:JAVA_HOME_17_X64\bin;$env:Path" }
          $tmp = Join-Path $env:RUNNER_TEMP "verapdf-instalacia"
          $ciel = Join-Path $env:RUNNER_TEMP "verapdf"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Invoke-WebRequest "https://software.verapdf.org/releases/verapdf-installer.zip" -OutFile "$tmp\instalator.zip"
          Expand-Archive "$tmp\instalator.zip" $tmp -Force
          $xml = @"
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>$ciel</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF CLI" selected="true"/>
              <pack index="2" name="veraPDF Documentation" selected="false"/>
              <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          "@
          Set-Content "$tmp\auto-install.xml" $xml.Trim() -Encoding utf8
          Get-ChildItem $tmp -Recurse | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName }
          $instalator = Get-ChildItem $tmp -Recurse -Filter "*.jar" | Where-Object { $_.Name -match 'install' } | Select-Object -First 1
          & java -jar $instalator.FullName "$tmp\auto-install.xml" | Out-Host
          $cli = Get-ChildItem $ciel -Recurse -Filter "verapdf.bat" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cli) { Write-Host "::warning::veraPDF sa nenainštaloval"; exit 0 }
          $sprava = Join-Path $export "verapdf.txt"
          & $cli.FullName --format text -v ($subory | ForEach-Object FullName) 2>&1 | Tee-Object -FilePath $sprava | Out-Host
          foreach ($riadok in Get-Content $sprava) {
            if ($riadok -match '^PASS\s') { Write-Host "::notice::veraPDF $($riadok -replace '%', '%25')" }
            elseif ($riadok -match '^FAIL\s') { Write-Host "::error::veraPDF $($riadok -replace '%', '%25')" }
          }

      - name: Uložiť výstupy samotestu (len vývojové vetvy)
        # aj po neúspešnom samoteste – záznam a snímky pomôžu nájsť chybu
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zdroj = Join-Path $env:RUNNER_TEMP "evita-samotest"
          $ciel = Join-Path $env:RUNNER_TEMP "vystupy"
          New-Item -ItemType Directory -Force $ciel | Out-Null
          foreach ($p in @("Export", "Vzory")) {
            if (Test-Path (Join-Path $zdroj $p)) { Copy-Item (Join-Path $zdroj "$p\*") $ciel -Force }
          }
          Copy-Item (Join-Path $zdroj "samotest.log") $ciel -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $zdroj "samotest_priebeh.log") $ciel -ErrorAction SilentlyContinue
          Set-Location $ciel
          git init -q -b vystupy
          git config user.name "EviTA zostavenie"
          git config user.email "zostavenie@users.noreply.github.com"
          git add -A
          git commit -q -m "Výstupy samotestu ${{ github.sha }}"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" vystupy

      - name: Zostaviť inštalátor
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.verzia.outputs.cislo }}" "/DSourceDir=$PWD\publish" installer\evita.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zverejniť novú verziu
        # vývojové vetvy sa len zostavia a otestujú, verzia sa zverejní iba z vetvy main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verzia = "${{ steps.verzia.outputs.cislo }}"
          $instalator = "installer/Output/EviTA_Setup_$verzia.exe"

          # staré priebežné vydanie z prvých verzií už nepotrebujeme
          gh release delete najnovsia --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0

          # novinky = zmeny od predchádzajúcej verzie
          $predosla = git describe --tags --abbrev=0 --match "v*" 2>$null
          $global:LASTEXITCODE = 0
          if ($predosla) {
            $zmeny = git log --no-merges --pretty=format:"- %s" "$predosla..HEAD"
          } else {
            $zmeny = git log --no-merges --pretty=format:"- %s" -n 15
          }
          $poznamky = @(
            "## Novinky vo verzii $verzia",
            "",
            ($zmeny -join "`n"),
            "",
            "Stiahnite súbor **EviTA_Setup_$verzia.exe** a spustite ho. Nainštalovaná EviTA (od verzie 0.2.7) ponúkne aktualizáciu sama pri spustení."
          ) -join "`n"
          Set-Content -Path notes.md -Value $poznamky -Encoding utf8

          gh release create "v$verzia" $instalator `
            --title "EviTA $verzia" `
            --notes-file notes.md `
            --latest `
            --target ${{ github.sha }}
